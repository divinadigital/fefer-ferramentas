<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FeFER | Links</title>
<meta name="description" content="FeFER Ferramentas para Usinagem, Criciúma SC. WhatsApp, catálogo, máquinas e como chegar.">
<meta name="theme-color" content="#06301a">
<meta property="og:title" content="FeFER Ferramentas para Usinagem">
<meta property="og:description" content="Fale com um especialista, veja o catálogo e as máquinas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  html,body{height:100%}
  body{background:var(--green-900);color:#fff}
  /* tudo cabe em uma tela: a coluna ocupa a altura visível e os espaços encolhem em telas baixas */
  .bio{position:relative;isolation:isolate;min-height:100svh;overflow:hidden;display:flex;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
  .bio::before{content:"";position:absolute;inset:-25% -40% auto;height:60%;z-index:-1;background:radial-gradient(closest-side,rgba(34,164,71,.38),transparent)}

  /* engrenagens girando ao fundo */
  .gears{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
  .gears svg{position:absolute;color:#fff}
  .g1{width:min(130vw,640px);right:-48%;top:50%;margin-top:calc(min(130vw,640px) / -2);opacity:.07;animation:spin 70s linear infinite}
  .g2{width:min(62vw,300px);left:-26%;top:-6%;opacity:.05;animation:spin 46s linear infinite reverse}
  .g3{width:min(50vw,240px);left:-14%;bottom:-8%;opacity:.045;animation:spin 38s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* a coluna ocupa a altura toda; os tamanhos crescem com a altura da tela (svh) para não sobrar vazio */
  .col{width:min(460px,100%);margin-inline:auto;display:flex;flex-direction:column;justify-content:space-between;gap:clamp(10px,1.9svh,20px);min-height:calc(100svh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
  .head{display:flex;align-items:center;gap:clamp(12px,1.8svh,18px)}
  .badge{width:clamp(64px,9.5svh,96px);height:clamp(64px,9.5svh,96px);flex:none;border-radius:clamp(18px,2.6svh,26px);background:var(--green-800);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;box-shadow:0 14px 30px -14px rgba(0,0,0,.7)}
  .badge img{width:80%}
  h1{font-size:clamp(1.75rem,3.9svh,2.4rem);line-height:1}
  h1 span{color:var(--yellow)}
  .tag{color:#cfe3d5;font-size:.86rem;line-height:1.35;margin-top:3px}
  .status{display:inline-flex;align-items:center;gap:.45rem;margin-top:6px;font-size:.78rem;color:#cfe3d5}
  .status i{width:7px;height:7px;border-radius:50%;background:#8a958f}
  .status.on i{background:#3ddc6f;animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(61,220,111,0)}0%{box-shadow:0 0 0 0 rgba(61,220,111,.6)}}

  .links{display:grid;grid-template-columns:1fr 1fr;gap:clamp(9px,1.3svh,12px)}
  .links .btn{justify-content:flex-start;gap:.6rem;padding:0 .9rem;min-height:clamp(48px,7.4svh,72px);border-radius:16px;font-size:clamp(.98rem,2svh,1.1rem);letter-spacing:.05em;text-align:left;line-height:1.05}
  .links .btn svg{width:20px;height:20px;flex:none}
  .links .btn .go{margin-left:auto;width:16px;height:16px;opacity:.7}
  .links .wide{grid-column:1/-1}
  .links .btn small{display:block;font-family:var(--body);font-weight:500;font-size:.76rem;letter-spacing:0;text-transform:none;opacity:.75;margin-top:2px}
  .btn--glass{--bg:rgba(6,48,26,.55);--fg:#fff;--fill:var(--yellow);--fg-hover:var(--ink);--bd:rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .btn--glass:hover{--bd:var(--yellow)}
  .links .btn--big{min-height:clamp(56px,9.4svh,88px);font-size:clamp(1.12rem,2.4svh,1.3rem)}
  .links .btn--big svg{width:24px;height:24px}

  /* categorias em faixa que corre sozinha */
  .grp{display:grid;gap:8px}
  .cats-title{font-family:var(--display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.74rem;color:var(--yellow)}
  .bcats{overflow:hidden;margin-inline:-16px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
  .bcats{display:grid;gap:8px}
  .cats-track{display:flex;gap:8px;width:max-content;animation:run 32s linear infinite}
  .cats-track.rev{animation-direction:reverse;animation-duration:38s}
  .bcats:hover .cats-track{animation-play-state:paused}
  /* segunda faixa de categorias e faixa de marcas só aparecem quando há altura sobrando */
  .cats-track.rev,.brands-wrap{display:none}
  @media (min-height:700px){ .cats-track.rev{display:flex} }
  @media (min-height:760px){ .brands-wrap{display:grid;gap:8px} }
  .bbrands{overflow:hidden;margin-inline:-16px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
  .brands-track{display:flex;gap:10px;width:max-content;animation:run 40s linear infinite}
  .bbrand{height:clamp(44px,5.6svh,54px);padding:0 18px;border-radius:14px;background:#fff;display:grid;place-items:center}
  .bbrand img{height:56%;width:auto;max-width:120px;object-fit:contain}
  @keyframes run{to{transform:translateX(-50%)}}
  .cat-mini{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);transition:border-color .3s}
  .cat-mini:hover{border-color:var(--yellow)}
  .cat-mini img{width:clamp(38px,5.4svh,46px);aspect-ratio:1;object-fit:contain;padding:4px;border-radius:10px;background:#fff}
  .cat-mini span{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:.86rem;white-space:nowrap}

  .bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .social{display:flex;gap:8px}
  .social a{position:relative;overflow:hidden;isolation:isolate;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2);color:#fff;transition:color .45s var(--ease-out)}
  .social a svg{width:18px;height:18px}
  .social a .fill{position:absolute;inset:-1px;z-index:-1;background:var(--yellow);pointer-events:none}
  .social a.is-filled{color:var(--ink)}
  .foot{font-size:.74rem;color:#8fb39b;line-height:1.35;text-align:right}
  .foot a{color:#cfe3d5}

  @media (max-height:640px){ .tag{display:none} .links .btn small{display:none} }
  .js [data-in]{opacity:0}
  @media (prefers-reduced-motion:reduce){ .js [data-in]{opacity:1} .gears svg,.cats-track,.status.on i{animation:none} }
</style>
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<main class="bio">
  <div class="gears" aria-hidden="true">
    <svg class="g1" viewBox="0 0 200 200"><use href="#gear"/></svg>
    <svg class="g2" viewBox="0 0 200 200"><use href="#gear"/></svg>
    <svg class="g3" viewBox="0 0 200 200"><use href="#gear"/></svg>
  </div>
  <div class="col">
    <div class="head" data-in>
      <div class="badge"><img src="assets/logo-fefer-negativo.png" alt="FeFER"></div>
      <div>
        <h1>FeFER <span>Ferramentas</span></h1>
        <p class="tag">Ferramentas e máquinas para usinagem em Criciúma, SC.</p>
        <span class="status" id="status"><i></i><b>Atendimento</b></span>
      </div>
    </div>

    <nav class="links" id="links" aria-label="Links"></nav>

    <div class="grp" data-in>
    <p class="cats-title">Navegue por categoria</p>
    <div class="bcats"><div class="cats-track" id="cats"></div><div class="cats-track rev" id="cats2" aria-hidden="true"></div></div>
    </div>

    <div class="brands-wrap" data-in>
      <p class="cats-title">Marcas que trabalhamos</p>
      <div class="bbrands"><div class="brands-track" id="brands"></div></div>
    </div>

    <div class="bottom" data-in>
      <div class="social" id="social"></div>
      <p class="foot" id="foot"></p>
    </div>
  </div>
</main>

<!-- desenho da engrenagem, reaproveitado pelas três do fundo -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="gear" fill="currentColor" fill-rule="evenodd">
    <path id="gearPath"/>
  </g>
</defs></svg>

<script src="assets/content.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>
<script>
(() => {
  /* gera o contorno da engrenagem: 14 dentes, furo central e 6 janelas */
  (() => {
    const T = 14, R = 96, r = 80, cx = 100, cy = 100, pts = [];
    for (let i = 0; i < T; i++) {
      const a = i / T * Math.PI * 2, s = Math.PI * 2 / T;
      [[a - s * .5, r], [a - s * .3, R], [a - s * .02, R], [a + s * .2, r]].forEach(([t, rad]) => pts.push(`${(cx + Math.cos(t) * rad).toFixed(2)} ${(cy + Math.sin(t) * rad).toFixed(2)}`));
    }
    let d = 'M' + pts.join('L') + 'Z';
    const circ = (rad) => `M${cx + rad} ${cy}a${rad} ${rad} 0 1 0 ${-rad * 2} 0a${rad} ${rad} 0 1 0 ${rad * 2} 0Z`;
    d += circ(22);
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2, x = cx + Math.cos(a) * 50, y = cy + Math.sin(a) * 50;
      d += `M${x + 12} ${y}a12 12 0 1 0 -24 0a12 12 0 1 0 24 0Z`;
    }
    document.getElementById('gearPath').setAttribute('d', d);
  })();

  const S = window.FEFER_SITE || {}, C = S.contato || {}, CATS = S.categorias || {};
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const wa = msg => `https://wa.me/${C.whatsapp}${msg ? '?text=' + encodeURIComponent(msg) : ''}`;
  const ico = {
    wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>',
    grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
    gear:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4L10.7 6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1l.3 2.7h4l.3-2.7a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>',
    doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.8 2.5 15.2 0 18M12 3c-2.5 2.8-2.5 15.2 0 18"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    go:'<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
    fb:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 9V7c0-.8.5-1 1-1h2V3h-3c-2.8 0-3.5 2-3.5 3.5V9H8v3h2.5v9H14v-9h2.6l.4-3z"/></svg>'
  };
  const mapa = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${C.endereco}, ${C.cidade}`)}`;
  const ext = 'target="_blank" rel="noopener"';

  /* status do atendimento: seg a sex, 08:00 às 12:00 e 13:30 às 18:00 (horário de Brasília) */
  const now = new Date(new Date().toLocaleString('en-US', { timeZone:'America/Sao_Paulo' }));
  const m = now.getHours() * 60 + now.getMinutes(), dia = now.getDay();
  const aberto = dia >= 1 && dia <= 5 && ((m >= 480 && m < 720) || (m >= 810 && m < 1080));
  const st = document.getElementById('status');
  st.classList.toggle('on', aberto);
  st.querySelector('b').textContent = aberto ? 'Atendendo agora' : 'Fora do horário, deixe sua mensagem';

  const L = [
    { cls:'btn--solid btn--big wide', fill:'', href:wa('Olá! Vim pelo Instagram e gostaria de falar com um especialista da FeFER.'), icon:ico.wa, t:'Fale com um especialista', s:'Resposta rápida pelo WhatsApp', ext:1 },
    { cls:'btn--glass', fill:'', href:'catalogo.html', icon:ico.grid, t:'Catálogo' },
    { cls:'btn--glass', fill:'', href:'maquinas.html', icon:ico.gear, t:'Máquinas' },
    { cls:'btn--glass', fill:'', href:wa('Olá! Vim pelo Instagram e gostaria de pedir um orçamento.'), icon:ico.doc, t:'Orçamento', ext:1 },
    { cls:'btn--glass', fill:'', href:mapa, icon:ico.pin, t:'Como chegar', ext:1 },
    { cls:'btn--glass wide', fill:'y', href:'index.html', icon:ico.globe, t:'Visite o site', s:'Conheça a FeFER' }
  ];
  document.getElementById('links').innerHTML = L.map(l => `<a class="btn ${l.cls}" data-fill="${l.fill}" data-in href="${esc(l.href)}" ${l.ext ? ext : ''}>${l.icon}<span>${esc(l.t)}${l.s ? `<small>${esc(l.s)}</small>` : ''}</span>${l.cls.includes('wide') ? ico.go : ''}</a>`).join('');

  const pick = ['fresamento', 'furacao', 'insertos', 'rosqueamento', 'medicao', 'fixacao', 'abrasivos', 'maquinas'].filter(k => CATS[k]);
  const catHtml = pick.map(k => `<a class="cat-mini" href="${k === 'maquinas' ? 'maquinas.html' : 'catalogo.html?cat=' + k}"><img src="${esc(CATS[k].img)}" alt="" loading="lazy"><span>${esc(CATS[k].nome)}</span></a>`).join('');
  const hidden = h => h.replace(/<a /g, '<a tabindex="-1" aria-hidden="true" ');
  document.getElementById('cats').innerHTML = catHtml + hidden(catHtml);
  /* segunda faixa começa no meio da lista para não repetir a de cima */
  const half = Math.ceil(pick.length / 2), rot = [...pick.slice(half), ...pick.slice(0, half)];
  const catHtml2 = rot.map(k => `<a class="cat-mini" href="${k === 'maquinas' ? 'maquinas.html' : 'catalogo.html?cat=' + k}"><img src="${esc(CATS[k].img)}" alt="" loading="lazy"><span>${esc(CATS[k].nome)}</span></a>`).join('');
  document.getElementById('cats2').innerHTML = hidden(catHtml2 + catHtml2);
  const logos = (S.marcas?.logos || []).map(l => `<span class="bbrand"><img src="${esc(l.logo)}" alt="${esc(l.nome)}" loading="lazy"></span>`).join('');
  document.getElementById('brands').innerHTML = logos + logos.replace(/<span class="bbrand">/g, '<span class="bbrand" aria-hidden="true">');

  document.getElementById('social').innerHTML = [
    C.instagram && `<a href="${esc(C.instagram)}" ${ext} aria-label="Instagram" data-fill="y">${ico.ig}</a>`,
    C.facebook && `<a href="${esc(C.facebook)}" ${ext} aria-label="Facebook" data-fill="y">${ico.fb}</a>`,
    C.email && `<a href="mailto:${esc(C.email)}" aria-label="E-mail" data-fill="y">${ico.mail}</a>`
  ].filter(Boolean).join('');
  document.getElementById('foot').innerHTML = `Seg a sex, 8h às 18h<br><a href="tel:+${esc(C.whatsapp)}">${esc(C.telefone)}</a>`;

  /* preenchimento direcional, igual ao site */
  const OFF = { left:'-101%,0', right:'101%,0', top:'0,-101%', bottom:'0,101%' };
  const edge = (el, e) => { const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height, d = { left:x, right:1 - x, top:y, bottom:1 - y }; return Object.keys(d).reduce((a, b) => d[a] < d[b] ? a : b); };
  document.querySelectorAll('[data-fill]').forEach(el => {
    const fill = document.createElement('span'); fill.className = 'fill'; fill.setAttribute('aria-hidden', 'true'); el.prepend(fill);
    const mode = el.dataset.fill;
    const set = (from, to) => { fill.style.transition = 'none'; if (from) fill.style.transform = `translate3d(${OFF[from]},0)`; if (from && to === undefined) return; fill.getBoundingClientRect(); fill.style.transition = 'transform .55s cubic-bezier(.65,0,.35,1)'; fill.style.transform = to ? `translate3d(${OFF[to]},0)` : 'translate3d(0,0,0)'; };
    set(mode === 'y' ? 'top' : 'left');
    el.addEventListener('pointerenter', e => { if (e.pointerType === 'touch') return; set(mode === 'x' ? 'left' : mode === 'y' ? 'top' : edge(el, e), null); el.classList.add('is-filled'); });
    el.addEventListener('pointerleave', e => { if (e.pointerType === 'touch') return; set(null, mode === 'x' ? 'right' : mode === 'y' ? 'bottom' : edge(el, e)); el.classList.remove('is-filled'); });
  });

  /* entrada em cascata */
  const items = document.querySelectorAll('[data-in]');
  const M = window.Motion;
  if (M && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
    M.animate(items, { opacity:[0, 1], y:[16, 0] }, { delay:M.stagger(.05), duration:.6, ease:[.22, 1, .36, 1] });
    M.animate('.badge', { scale:[.7, 1], rotate:[-8, 0] }, { type:'spring', stiffness:220, damping:14 });
  } else items.forEach(i => i.style.opacity = 1);
})();
</script>
</body>
</html>
