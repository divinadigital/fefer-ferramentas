<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FeFER | Links</title>
<meta name="description" content="FeFER Ferramentas para Usinagem, Criciúma SC. WhatsApp, catálogo, máquinas e como chegar.">
<meta name="theme-color" content="#06301a">
<meta property="og:title" content="FeFER Ferramentas para Usinagem">
<meta property="og:description" content="Fale com um especialista, veja o catálogo e as máquinas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  body{background:var(--green-900);color:#fff;min-height:100svh}
  .bio{position:relative;isolation:isolate;min-height:100svh;overflow:hidden;padding:44px 16px calc(36px + env(safe-area-inset-bottom))}
  /* fundo: brilho suave e grade de linhas finas */
  .bio::before{content:"";position:absolute;inset:-20% -40% auto;height:70%;z-index:-1;background:radial-gradient(closest-side,rgba(34,164,71,.45),transparent);filter:blur(10px)}
  .bio::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.07;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(#000,transparent 70%);-webkit-mask-image:linear-gradient(#000,transparent 70%)}
  .col{width:min(460px,100%);margin-inline:auto;display:flex;flex-direction:column;align-items:center;text-align:center}
  .badge{width:104px;height:104px;border-radius:28px;background:var(--green-800);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;box-shadow:0 20px 40px -18px rgba(0,0,0,.7)}
  .badge img{width:84px}
  h1{font-size:2.3rem;margin-top:20px;line-height:1}
  h1 span{color:var(--yellow)}
  .tag{margin-top:10px;color:#cfe3d5;line-height:1.5;max-width:340px}
  .status{margin-top:16px;display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .85rem;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:.85rem;color:#cfe3d5}
  .status i{width:8px;height:8px;border-radius:50%;background:#8a958f}
  .status.on i{background:#3ddc6f;box-shadow:0 0 0 0 rgba(61,220,111,.6);animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(61,220,111,0)}100%{box-shadow:0 0 0 0 rgba(61,220,111,0)}}

  .links{width:100%;display:grid;gap:12px;margin-top:28px}
  .links .btn{width:100%;justify-content:flex-start;padding:1rem 1.15rem;border-radius:18px;font-size:1.05rem;text-align:left}
  .links .btn svg{width:22px;height:22px;flex:none}
  .links .btn .go{margin-left:auto;width:18px;height:18px;opacity:.7}
  .links .btn small{display:block;font-family:var(--body);font-weight:500;font-size:.8rem;letter-spacing:0;text-transform:none;opacity:.75;margin-top:2px}
  .btn--glass{--bg:rgba(255,255,255,.05);--fg:#fff;--fill:var(--yellow);--fg-hover:var(--ink);--bd:rgba(255,255,255,.16)}
  .btn--glass:hover{--bd:var(--yellow)}
  .btn--big{padding:1.2rem 1.15rem !important;font-size:1.2rem !important}

  .cats-title{margin-top:34px;font-family:var(--display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.8rem;color:var(--yellow)}
  .cats{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .cat-mini{position:relative;border-radius:16px;overflow:hidden;background:#fff;aspect-ratio:1;border:1px solid rgba(255,255,255,.14);transition:transform .35s var(--ease-out)}
  .cat-mini img{width:100%;height:100%;object-fit:contain;padding:12px 12px 30px}
  .cat-mini span{position:absolute;left:0;right:0;bottom:0;padding:6px 4px;background:var(--green-700);font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:.82rem;color:#fff}
  .cat-mini:hover{transform:translateY(-3px)}

  .social{display:flex;gap:10px;justify-content:center;margin-top:30px}
  .social a{position:relative;overflow:hidden;isolation:isolate;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2);color:#fff;transition:color .45s var(--ease-out)}
  .social a svg{width:20px;height:20px}
  .social a .fill{position:absolute;inset:-1px;z-index:-1;background:var(--yellow);pointer-events:none}
  .social a.is-filled{color:var(--ink)}
  .foot{margin-top:22px;font-size:.8rem;color:#8fb39b;line-height:1.6}
  .foot a{text-decoration:underline;text-underline-offset:3px}

  .js [data-in]{opacity:0}
  @media (prefers-reduced-motion:reduce){ .js [data-in]{opacity:1} .status.on i{animation:none} }
</style>
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<main class="bio">
  <div class="col">
    <div class="badge" data-in><img src="assets/logo-fefer-negativo.png" alt="FeFER"></div>
    <h1 data-in>FeFER <span>Ferramentas</span></h1>
    <p class="tag" data-in>Ferramentas e máquinas para usinagem em Criciúma, SC. Atendimento técnico para indicar a ferramenta certa.</p>
    <span class="status" id="status" data-in><i></i><b>Atendimento</b></span>

    <nav class="links" id="links" aria-label="Links"></nav>

    <p class="cats-title" data-in>Navegue por categoria</p>
    <div class="cats" id="cats"></div>

    <div class="social" id="social" data-in></div>
    <p class="foot" data-in id="foot"></p>
  </div>
</main>

<script src="assets/content.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>
<script>
(() => {
  const S = window.FEFER_SITE || {}, C = S.contato || {}, CATS = S.categorias || {};
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const wa = msg => `https://wa.me/${C.whatsapp}${msg ? '?text=' + encodeURIComponent(msg) : ''}`;
  const ico = {
    wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>',
    grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
    gear:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4L10.7 6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1l.3 2.7h4l.3-2.7a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>',
    doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.8 2.5 15.2 0 18M12 3c-2.5 2.8-2.5 15.2 0 18"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    go:'<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
    fb:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 9V7c0-.8.5-1 1-1h2V3h-3c-2.8 0-3.5 2-3.5 3.5V9H8v3h2.5v9H14v-9h2.6l.4-3z"/></svg>'
  };
  const mapa = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${C.endereco}, ${C.cidade}`)}`;
  const ext = 'target="_blank" rel="noopener"';

  /* status do atendimento: seg a sex, 08:00 às 12:00 e 13:30 às 18:00 (horário de Brasília) */
  const now = new Date(new Date().toLocaleString('en-US', { timeZone:'America/Sao_Paulo' }));
  const m = now.getHours() * 60 + now.getMinutes(), dia = now.getDay();
  const aberto = dia >= 1 && dia <= 5 && ((m >= 480 && m < 720) || (m >= 810 && m < 1080));
  const st = document.getElementById('status');
  st.classList.toggle('on', aberto);
  st.querySelector('b').textContent = aberto ? 'Atendendo agora' : 'Fora do horário, deixe sua mensagem';

  const L = [
    { cls:'btn--solid btn--big', fill:'', href:wa('Olá! Vim pelo Instagram e gostaria de falar com um especialista da FeFER.'), icon:ico.wa, t:'Fale com um especialista', s:'Resposta rápida pelo WhatsApp', ext:1 },
    { cls:'btn--glass', fill:'', href:'catalogo.html', icon:ico.grid, t:'Catálogo completo', s:'Fresamento, furação, insertos e mais' },
    { cls:'btn--glass', fill:'', href:'maquinas.html', icon:ico.gear, t:'Máquinas', s:'Tornos, centros de usinagem e afiadoras' },
    { cls:'btn--glass', fill:'', href:wa('Olá! Vim pelo Instagram e gostaria de pedir um orçamento.'), icon:ico.doc, t:'Pedir orçamento', s:'Envie a lista e receba a proposta', ext:1 },
    { cls:'btn--glass', fill:'y', href:mapa, icon:ico.pin, t:'Como chegar', s:`${C.endereco}, ${C.cidade}`, ext:1 },
    { cls:'btn--glass', fill:'y', href:'index.html', icon:ico.globe, t:'Visite o site', s:'Conheça a FeFER' }
  ];
  document.getElementById('links').innerHTML = L.map(l => `<a class="btn ${l.cls}" data-fill="${l.fill}" data-in href="${esc(l.href)}" ${l.ext ? ext : ''}>${l.icon}<span>${esc(l.t)}<small>${esc(l.s)}</small></span>${ico.go}</a>`).join('');

  const pick = ['fresamento', 'furacao', 'insertos', 'rosqueamento', 'medicao', 'maquinas'].filter(k => CATS[k]);
  document.getElementById('cats').innerHTML = pick.map(k => `<a class="cat-mini" data-in href="${k === 'maquinas' ? 'maquinas.html' : 'catalogo.html?cat=' + k}"><img src="${esc(CATS[k].img)}" alt="" loading="lazy"><span>${esc(CATS[k].nome)}</span></a>`).join('');

  document.getElementById('social').innerHTML = [
    C.instagram && `<a href="${esc(C.instagram)}" ${ext} aria-label="Instagram" data-fill="y">${ico.ig}</a>`,
    C.facebook && `<a href="${esc(C.facebook)}" ${ext} aria-label="Facebook" data-fill="y">${ico.fb}</a>`,
    `<a href="${wa()}" ${ext} aria-label="WhatsApp" data-fill="y">${ico.wa}</a>`,
    C.email && `<a href="mailto:${esc(C.email)}" aria-label="E-mail" data-fill="y">${ico.mail}</a>`
  ].filter(Boolean).join('');
  document.getElementById('foot').innerHTML = `${esc(C.horario)}<br><a href="tel:+${esc(C.whatsapp)}">${esc(C.telefone)}</a>`;

  /* preenchimento direcional, igual ao site */
  const OFF = { left:'-101%,0', right:'101%,0', top:'0,-101%', bottom:'0,101%' };
  const edge = (el, e) => { const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height, d = { left:x, right:1 - x, top:y, bottom:1 - y }; return Object.keys(d).reduce((a, b) => d[a] < d[b] ? a : b); };
  document.querySelectorAll('[data-fill]').forEach(el => {
    const fill = document.createElement('span'); fill.className = 'fill'; fill.setAttribute('aria-hidden', 'true'); el.prepend(fill);
    const mode = el.dataset.fill;
    const set = (from, to) => { fill.style.transition = 'none'; if (from) fill.style.transform = `translate3d(${OFF[from]},0)`; if (from && to === undefined) return; fill.getBoundingClientRect(); fill.style.transition = 'transform .55s cubic-bezier(.65,0,.35,1)'; fill.style.transform = to ? `translate3d(${OFF[to]},0)` : 'translate3d(0,0,0)'; };
    set(mode === 'y' ? 'top' : 'left');
    el.addEventListener('pointerenter', e => { if (e.pointerType === 'touch') return; set(mode === 'x' ? 'left' : mode === 'y' ? 'top' : edge(el, e), null); el.classList.add('is-filled'); });
    el.addEventListener('pointerleave', e => { if (e.pointerType === 'touch') return; set(null, mode === 'x' ? 'right' : mode === 'y' ? 'bottom' : edge(el, e)); el.classList.remove('is-filled'); });
  });

  /* entrada em cascata */
  const items = document.querySelectorAll('[data-in]');
  const M = window.Motion;
  if (M && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
    M.animate(items, { opacity:[0, 1], y:[18, 0], filter:['blur(6px)', 'blur(0px)'] }, { delay:M.stagger(.06), duration:.7, ease:[.22, 1, .36, 1] });
    M.animate('.badge', { scale:[.7, 1], rotate:[-8, 0] }, { type:'spring', stiffness:220, damping:14 });
  } else items.forEach(i => i.style.opacity = 1);
})();
</script>
</body>
</html>
